server:
  port: 8761

spring:
  application:
    name: eureka-server
  zipkin:
    base-url: http://zipkin:9411
      # Sleuth Properties
  sleuth:
    sampler:
      probability: 1.0

# Eureka Properties

eureka:
    client:
    fetch-registry: false
    register-with-eureka: false
  instance:
    hostname: eureka-server
    prefer-ip-address: true
